[project]
name = "executor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "prometheus-client",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = []

[tool.mypy]
files = ["src", "tests", "sandbox"]
mypy_path = "sandbox"
python_version = "3.12"
platform = "linux"
strict = true
